name: CI_Tests

on:
    push:
        branches:
             - "**"
    pull_request:
  
permissions:
    contents: read

jobs:
    typecheck:
      runs-on: ubuntu-latest
      
      steps:
        - name: Checkout code
          uses: actions/checkout@v5

        - name: Setup Node.js
          uses: actions/setup-node@v5
          with:
            node-version: 22
            cache: npm 

        - name: Install dependencies
          run: npm ci

        - name: Run TypeScript typecheck
          run: npm run typecheck

        - name: Run Prettier check
          run: npm run format:check

        - name: Run test
          run: npm test
        
  